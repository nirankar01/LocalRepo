<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Properties</title>
</head>
<style>
    .design {
        display: flex;
        background-color: thistle;
        width: 50%;
        font-size: 25px;
        flex-wrap: wrap;
        /* flex-direction: column; */
        /*flex-direction: row;*/
        /*flex-direction: row-reverse;*/
        /*  flex-direction: column-reverse;*/

        height: 300px;
        /*align-items: center;*/
        align-items: flex-start;
        /*justify-content: center;*/
    }

    .design>p {
        background-color: red;
        margin: 10px;
        padding: 20px;
    }
</style>

<body>
    <div class="design">
        <p style="order: 3; flex-basis:50px ">1</p>
        <p>2</p>
        <p>3</p>
        <p>4</p>
        <p style="order: 7;flex-grow:3;flex-shrink:2;">5</p>
        <p style="order:8;flex-grow:6;flex-shrink:5">6</p>
        <p>7</p>
        <p>8</p>
        <p>9</p>
        <p style="flex: 20px 12px 11px;">10</p> <!--grow,shrink,basis-->
    </div>
    <!-- dimenstion responsive is used for size in any device or system -->
</body>

</html>
